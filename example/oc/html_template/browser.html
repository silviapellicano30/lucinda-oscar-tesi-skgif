    <script>
      Lucinda.init({
          templates_url: "../static/browser/templates/",
          templates: [
            "new_venue_browser",
            "new_ci_browser",
            "new_ra_browser",
            "new_org_browser", // SILVIA: ra/ that is not a person (new_ra_browser checks /persons)
            "new_br_any_browser",
            "doc_citations",
            "doc_references",
            "doc_free_text",
            "aut_free_text",
            "venue_free_text",
            "org_free_text" // SILVIA: organisation search
          ],
          verbose: true
      });
      Lucinda.run();

    </script>
